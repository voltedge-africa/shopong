packages:
  - "apps/*"
  - "packages/*"
# Kepler.gl pulls in deck.gl typings whose install script only repackages type definitions.
allowBuilds:
  "@danmarshall/deckgl-typings": false
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@0.3.0
  vite-plus: 0.3.0
minimumReleaseAgeExclude:
  - "@expo/cli@58.1.15"
  - "@expo/config@58.0.8"
  - "@expo/local-build-cache-provider@58.0.8"
  - "@expo/metro-config@58.0.17"
  - "@expo/prebuild-config@58.0.16"
  - "@expo/router-server@58.0.17"
  - babel-preset-expo@58.0.20
  - expo-file-system@58.0.11
  - expo-font@58.0.10
  - expo-glass-effect@58.0.5
  - expo-modules-autolinking@58.0.15
  - expo-modules-cli@0.3.2
  - expo-modules-core@58.0.26
  - expo-modules-jsi@58.0.19
  - expo-router@58.0.26
  - expo-server@58.0.6
  - expo@58.0.19
overrides:
  vite@*: "catalog:"
  # One version of the React types for the whole workspace. Kepler.gl asks for the React 18 types,
  # and with two majors installed every package without its own copy picks the wrong one.
  "@types/react": "19.3.0"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
