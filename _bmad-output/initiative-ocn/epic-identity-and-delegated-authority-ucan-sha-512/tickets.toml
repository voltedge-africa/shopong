# Epic 2: Identity and delegated authority (UCAN, SHA-512). Story order follows epics.md.

[[entry]]
id = 1
type = "spike"
title = "Spike: UCAN library on Expo (ts-ucan vs iso-ucan)"
description = "Tests whether ts-ucan or iso-ucan builds, signs and verifies capability chains in an Expo app on iOS, Android and web, and what their maintenance risk is. Ends in a decision record naming the library and its exit path."
verify = "Both libraries are exercised on each platform and a decision record states the chosen library, its risks and its exit path via the CapabilityAuth port."
hitl = false
references = ["../../planning-artifacts/epics.md"]

[[entry]]
id = 2
type = "story"
title = "Create my identity on this device"
description = "A person creates an Ed25519 identity (did:key) that lives only on their phone, with the private key in secure storage. Reinstalling without a backup does not pretend to recover the old identity."
verify = "Choosing Create my identity stores the private key in secure storage and shows a short readable DID, and a reinstall without a backup offers recovery instead of the old identity."
hitl = false
references = ["../../planning-artifacts/epics.md"]

[[entry]]
id = 3
type = "story"
title = "Create a community and join by invitation"
description = "A treasurer creates a community and invites members with a link or single-use code carrying a short-lived invitation UCAN. Newcomers join with offline verification, and expired or reused invitations are rejected."
verify = "A valid invitation joins offline and is recorded as member.joined, while an expired or reused invitation is rejected with a clear reason."
hitl = false
references = ["../../planning-artifacts/epics.md"]

[[entry]]
id = 4
type = "story"
title = "Roles with limits as delegated capabilities"
description = "Treasurers grant roles such as co-treasurer, driver or supplier with limits, and holders can act only within those limits and the role's expiry. Delegations wider or higher than the holder's own are refused."
verify = "A delegation with a lower ceiling is accepted, one with a higher ceiling or wider resource is rejected, and a delegated role stops working with the reason shown once its expiry passes."
hitl = false
references = ["../../planning-artifacts/epics.md"]

[[entry]]
id = 5
type = "story"
title = "Verify authority on device, in the record and at the Node"
description = "Checks every action's authority in three places (on the device, in the record's apply and at the Node), so a forged or stale authorisation cannot cause a real-world effect. Verification works offline."
verify = "A tampered or missing proof is refused and its reason recorded in all three places, and a valid chain verifies with no network call."
hitl = false
references = ["../../planning-artifacts/epics.md"]

[[entry]]
id = 6
type = "story"
title = "Revocation, key loss and recovery"
description = "A member recovers their identity and writer keys from a recovery phrase on a new device, and two named trustees can revoke a lost key and re-delegate the role. Revoked keys are refused everywhere from the next sync."
verify = "Restoring from the recovery phrase on a new device recovers the same DID and writer keys, and a role.revoked event makes the old key's actions refused from the next sync."
hitl = false
references = ["../../planning-artifacts/epics.md"]

[[entry]]
id = 7
type = "story"
title = "SHA-512 content hashes and keyed commitments for personal data"
description = "Ensures phone numbers and ID numbers reach the shared record only as HMAC-SHA512 commitments, and that attached files are hashed with SHA-512 so recipients can verify them."
verify = "The record holds only HMAC-SHA512 commitments for personal values, and a recipient who re-hashes an attached file sees verified or does not match."
hitl = false
references = ["../../planning-artifacts/epics.md"]
