# Epic 6: Documents and decisions (Unlimited OCR, Laya). Story order follows epics.md.

[[entry]]
id = 1
type = "spike"
title = "Spike: Unlimited-OCR on real documents and GPU sizing"
description = "Measures Unlimited-OCR accuracy and cost on at least 30 real South African supplier documents, covering VRAM, pages per minute and output format. Ends with decision D-4 on where GPU compute runs."
verify = "Field accuracy, pages per minute, VRAM and cost per page are recorded on at least 30 real documents, and decision D-4 is recorded."
hitl = false
references = ["../../planning-artifacts/epics.md"]

[[entry]]
id = 2
type = "story"
title = "OCR service behind the Ocr port"
description = "Uploaded price lists in Hyperdrive are queued by the Node, rasterised at 300 DPI and sent to the OCR endpoint, with the raw output stored beside the source. Failures retry with backoff and show in the operator view."
verify = "An uploaded price list is rasterised at 300 DPI, its raw output with boxes is stored beside the source, and failures retry with backoff and surface in the operator view."
hitl = false
references = ["../../planning-artifacts/epics.md"]

[[entry]]
id = 3
type = "story"
title = "Structured quotes with human review"
description = "Shows each extracted price-list row beside its source region so a treasurer can accept, edit or reject it before it counts. Accepted rows become quote.added events carrying the source hash."
verify = "Each extracted row (item, unit, pack size, price) can be accepted, edited or rejected beside its source, and accepted rows become quote.added events with the source hash."
hitl = false
references = ["../../planning-artifacts/epics.md"]

[[entry]]
id = 4
type = "spike"
title = "Spike: Laya calibration and fine-tune on our decisions"
description = "Tests whether Laya beats the majority-class baseline on our own labelled decisions after calibration and fine-tuning, question by question. Questions that do not beat the baseline stay human decisions."
verify = "Accuracy, calibration error and confidence threshold are recorded for each question against the baseline, and any question that does not beat it is not shipped."
hitl = false
references = ["../../planning-artifacts/epics.md"]

[[entry]]
id = 5
type = "story"
title = "Rank supplier quotes with confidence"
description = "Ranks three to eight supplier quotes through laya-serve with a stated confidence and criteria, and says no clear recommendation below the threshold. A treasurer's override is logged as a labelled example."
verify = "A ranking shows rank, confidence and criteria, falls back to 'no clear recommendation' below the threshold, and a logged override is stored as a labelled example."
hitl = false
references = ["../../planning-artifacts/epics.md"]

[[entry]]
id = 6
type = "story"
title = "Flag odd payments and mismatched delivery notes"
description = "Attaches a flag with confidence to unusual payment requests and to delivery notes that do not match their order, and surfaces the flags to approvers. Nothing is blocked automatically."
verify = "A flag above the confidence threshold is attached to a payment request or delivery note, shown to the approvers, and nothing is blocked automatically."
hitl = false
