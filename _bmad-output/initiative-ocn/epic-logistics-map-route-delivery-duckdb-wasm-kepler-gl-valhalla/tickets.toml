# Epic 7: Logistics: map, route, delivery (DuckDB-WASM, Kepler.gl, Valhalla). Story order is build order.

[[entry]]
id = 1
type = "spike"
title = "Valhalla tiles, routing and mobile viability"
description = "Builds tiles from an OSM extract and tests Valhalla routing, isochrones, matrix and optimised routes in the browser and Node, and whether the engine runs on iOS and Android, ending in a recorded decision."
verify = "Tile size, build time, route latency and memory are recorded for browser and Node, each Valhalla feature is marked working or not, and a mobile viability decision is on record."
covers = ["AR7"]
after = []
hitl = false
risk = "high"

[[entry]]
id = 2
type = "story"
title = "Tile build pipeline and hosting"
description = "A reproducible pipeline builds tiles, graph.tar and a versioned manifest from a pinned OSM extract into static storage, with OSM attribution shown in the app and Node."
verify = "Running the pipeline on the pinned extract writes tiles, graph.tar and a manifest with a release id to static storage, and the app and Node display the OSM (ODbL) attribution."
covers = ["AR9", "NFR8"]
after = [1]
hitl = false
risk = "medium"

[[entry]]
