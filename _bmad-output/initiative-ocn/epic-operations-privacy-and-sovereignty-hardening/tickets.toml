# Epic 12: Operations, privacy and sovereignty hardening. Story order follows epics.md.

[[entry]]
id = 1
type = "story"
title = "Self-host kit"
description = "One compose file and an operator guide let a community run the Node, the tile host, laya-serve and optional GPU services on its own infrastructure, with secrets supplied out of band."
verify = "Following the operator guide on a clean machine starts all services and passes a smoke test, with secrets provided out of band and not in the repo."
hitl = false
references = ["../../planning-artifacts/epics.md"]

[[entry]]
id = 2
type = "story"
title = "Backup, restore and recovery drill"
description = "Tests restoring the Node on new hardware and a member recovering on a new phone, and rebuilding the ledger from mirrored record events. The results must match the originals."
verify = "After restore, the record, the member's identity and balances match the originals, and the ledger rebuilt from record events matches Ledfra."
hitl = false
references = ["../../planning-artifacts/epics.md"]

[[entry]]
id = 3
type = "story"
title = "POPIA and data-minimisation review"
description = "Reviews which personal data is stored where and classifies each field by device, commitment, ledger metadata or shared record, with its lawful basis, retention and deletion approach. Gaps become new stories."
verify = "Every field in the data inventory is classified with its lawful basis, retention and deletion approach, and any gap found is turned into a story."
hitl = false
references = ["../../planning-artifacts/epics.md"]

[[entry]]
id = 4
type = "story"
title = "Observability"
description = "Dashboards and alerts for replication lag, webhook failures, stalled queues and reconciliation problems, so issues are found before members find them."
verify = "A failed webhook, a stalled queue or replication lag beyond a threshold fires an alert that names the space and event id."
hitl = false
references = ["../../planning-artifacts/epics.md"]

[[entry]]
id = 5
type = "story"
title = "Low-end Android performance and data budgets"
description = "Measures start-up time, memory, battery and data per flow on the device baseline from decision D-6, and adds a low-data mode that defers photos and large files."
verify = "The performance suite meets the stated budgets for start-up, memory, battery and data per flow, and low-data mode defers photos and large files."
hitl = false
references = ["../../planning-artifacts/epics.md"]

[[entry]]
id = 6
type = "story"
title = "Security review and hardening"
description = "An independent review of key handling, webhooks, the sandbox and the web console, with findings triaged to owners and the WASM content security policy scoped to the console origin."
verify = "Review findings are triaged with owners, and the CSP for WASM is scoped to the console origin only."
hitl = false
references = ["../../planning-artifacts/epics.md"]

[[entry]]
id = 7
type = "story"
title = "Licences, attribution and supply-chain register"
description = "Generates a register of every dependency's and data source's licence, including Apache-2.0 and MIT components, OSM ODbL attribution and Valhalla's compiled-dependency notices. CI fails when an unregistered licence appears."
verify = "The generated register lists every licence and attribution, and CI fails when an unregistered licence appears."
hitl = false
references = ["../../planning-artifacts/epics.md"]
