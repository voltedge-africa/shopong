# Epic 8: Demonstration 1: stokvel bulk order. Story order is build order.

[[entry]]
id = 1
type = "story"
title = "Start a stokvel and invite members"
description = "A stokvel treasurer creates the stokvel with a name, rules and roles and brings members in by invitation, with the creator able to work offline."
verify = "Creating a stokvel and inviting members shows the joined members with their roles, and the creator's offline changes sync once online."
covers = ["FR2", "NFR1"]
after = ["2.3", "3.2", "3.4"]
hitl = false
risk = "medium"

[[entry]]
id = 2
type = "story"
title = "Propose a bulk grocery order"
description = "A member with order/propose submits a bulk order with a list, a budget and a deadline, and the treasurer's approval opens quotes and pledges."
verify = "A submitted proposal appears to all members with the budget per member and the deadline, and the treasurer's approval opens quotes and pledges."
covers = ["FR6"]
after = [1, "2.4"]
hitl = false
risk = "medium"

[[entry]]
id = 3
type = "story"
title = "Compare supplier options"
description = "Members compare reviewed supplier quotes side by side on price per item, totals, delivery terms and the ranked suggestion with its confidence, and the treasurer selects a supplier."
verify = "The comparison shows price per item, totals, delivery terms and the ranked suggestion for at least two suppliers, and the selection is recorded as quote.selected."
covers = ["FR8"]
after = [2, "6.8", "6.9"]
hitl = false
risk = "medium"

[[entry]]
id = 4
type = "story"
title = "Pledge and pay, with funding progress"
description = "Members commit and pay their share through Stitch, moving from requested to paid, while the funding bar updates for everyone and unpaid members show as unpaid without bank details."
verify = "A pledge moves from requested to paid through Stitch, the funding bar updates for all members, and an unpaid member is shown as unpaid without bank details."
covers = ["FR9", "UX-DR1"]
after = [3, "4.3", "4.5", "4.6"]
hitl = false
risk = "high"
references = ["architecture-ocn/architecture-ocn.md#ad-13"]

[[entry]]
id = 5
type = "story"
title = "Approve and pay the supplier"
description = "Once the pool is funded and the required approvers agree, the supplier is paid and every member sees supplier paid, with the ledger and the record in agreement."
verify = "With a funded pool and the required approvals, the supplier is paid and the ledger, the record and every member's view show supplier paid."
covers = ["FR11"]
after = [4, "4.7"]
hitl = false
risk = "high"
references = ["architecture-ocn/architecture-ocn.md#ad-3"]

