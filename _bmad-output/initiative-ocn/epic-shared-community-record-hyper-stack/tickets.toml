# Epic 3: Shared community record (Hyper* stack). Story order is build order.

[[entry]]
id = 1
type = "spike"
title = "Hypercore stack in a Bare worklet inside Expo"
description = "Measures whether Corestore, Autobase, Hyperbee, Hyperdrive and Hyperswarm run in a react-native-bare-kit worklet on low-end iOS and Android, including start-up, memory, battery and iOS background suspension, and selects the Node-held-writers fallback if the budget fails."
verify = "The Linux evidence and the multi-day device cost are recorded and a decision record selects the mobile architecture: the OCN Node holds the writers, and the on-phone design stays a later spike behind the same port."
covers = ["AR3", "AR11", "NFR2"]
after = ["1.1"]
hitl = false
risk = "high"
references = ["architecture-ocn/architecture-ocn.md#ad-14"]

[[entry]]
id = 2
type = "story"
title = "Create a community space with a deterministic view"
description = "Creates each community's own Autobase with a Hyperbee view and a versioned apply function, so one recorded event stream always yields the same view, and apply uses no wall clock, network or randomness."
verify = "Replaying the same events in different arrival orders on two devices produces byte-identical views, as a property test shows."
covers = ["FR2", "FR4", "AR4", "NFR4"]
after = [1, "1.2", "1.3", "2.2"]
hitl = false
risk = "high"

[[entry]]
id = 3
type = "story"
title = "Admit and remove writers by capability"
description = "A new member becomes a writer, with a writer key the OCN Node holds for them, only through a valid invitation UCAN chain, and removing a member removes that writer key but never the last indexer."
verify = "A valid member.joined event adds the writer key via host.addWriter, and removing a member calls removeWriter but refuses to remove the last indexer."
covers = ["FR2"]
after = [2, "2.3", "2.5"]
hitl = false
risk = "high"

[[entry]]
id = 4
type = "story"
title = "Offline writes that converge"
description = "Members record actions on their phone offline for hours and sync later over an authenticated connection to the OCN Node, so poor connectivity does not stop the group, and events the group has not yet seen are marked on the device."
verify = "A phone that writes offline and reconnects syncs with the Node with no lost events, two phones that diverge offline reconverge to the same view, and unseen events are marked 'on your phone' until the group has seen them."
covers = ["FR4", "NFR1"]
after = [1, 2, 3, 5]
hitl = false
risk = "high"

[[entry]]
id = 5
type = "story"
title = "Always-on seeder, indexer, relay and bootstrap on the OCN Node"
description = "The OCN Node holds each community's Autobase and the writer keys of its members, acknowledges writes, serves the full record to phones over an authenticated connection, and keeps the record available when phones are off; relay and bootstrap for direct phone-to-phone sync stay as later work for the on-phone design."
verify = "The Node holds and serves a space when members write, a phone connects with a valid identity proof and syncs, and a test confirms the Node refuses a client with no valid proof."
covers = ["FR4"]
after = [1, 2, "1.1", "1.5", "2.2"]
hitl = false
risk = "high"
references = ["architecture-ocn/architecture-ocn.md#ad-19"]

[[entry]]
id = 6
type = "story"
title = "Deterministic capability checks in `apply` using log time"
description = "Evaluates UCAN expiry and revocation against log time (the highest accepted claimedAt) rather than the device clock, so every peer reaches the same result, and later events that use a revoked capability are refused."
verify = "UCAN expiry is evaluated against log time so that a replay on a later date gives the same result, and an event using a revoked capability is rejected and recorded as refused."
covers = ["NFR4"]
after = [2, "2.4", "2.5"]
hitl = false
risk = "high"

[[entry]]
id = 7
type = "story"
title = "Files and photos in Hyperdrive with hash references"
description = "Attaches price lists, receipts and delivery photos to the record as Hyperdrive files the OCN Node holds, whose events carry a SHA-512, fetched lazily by a phone over its connection and verified, freed on low storage, with large files streamed."
verify = "An attached file's event carries its SHA-512, a receiving device fetches and verifies it lazily, and a blob freed with clear(path) is re-fetched on demand."
covers = ["FR5", "NFR9"]
after = [1, 2, "1.3"]
hitl = false
risk = "high"
references = ["architecture-ocn/architecture-ocn.md#6-data-and-identifiers"]

[[entry]]
id = 8
type = "spike"
title = "Spike and first view: query community data with SQL in the web console"
description = "Shows that the web console can export the Hyperbee view to Arrow, run DuckDB-WASM SQL and render the result in a table, so organisers can ask questions such as who has not paid without a server, and records the persistence and GeoJSON decisions."
verify = "A pinned @duckdb/duckdb-wasm runs a query over the exported view and renders a table, and a decision record states OPFS persistence, GeoJSON handling and the pinned version."
covers = ["AR2", "AR3", "AR7"]
after = [2]
hitl = false
risk = "high"
references = ["architecture-ocn/architecture-ocn.md#ad-5"]

[[entry]]
id = 9
type = "spike"
title = "Spike (optional): nearby sync over Bluetooth"
description = "Tests whether two phones can exchange a Corestore replication stream over Bluetooth L2CAP with no internet, so a stokvel meeting can sync with no coverage, and if that is not workable the decision drops it or limits it to a small sync hint."
verify = "Throughput and the iOS and Android permissions for a Bluetooth replication channel are recorded, and a decision record keeps, limits or drops the feature."
covers = ["AR3", "NFR1"]
after = [1]
hitl = false
risk = "high"

